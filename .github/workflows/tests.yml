name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - spike/opentimestamps-interoperability

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install development-only interoperability oracles
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run fixture and cross-implementation tests
        run: npm test

  canonical-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Use Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install pinned canonical OpenTimestamps client
        run: python -m pip install --disable-pip-version-check "git+https://github.com/opentimestamps/opentimestamps-client.git@cd71c7609421bed2a07b9642a3c02a58c9fd2cdf"

      - name: Run canonical fixture checks
        run: bash scripts/check-python-interop.sh
