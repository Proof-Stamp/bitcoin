name: tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install JavaScript test dependencies
        shell: bash
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build browser foundation and run Node tests
        shell: bash
        run: npm run check

  canonical-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Use Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install canonical Python OpenTimestamps client
        shell: bash
        run: python -m pip install --disable-pip-version-check "git+https://github.com/opentimestamps/opentimestamps-client.git@cd71c7609421bed2a07b9642a3c02a58c9fd2cdf"

      - name: Run canonical Python interoperability tests
        shell: bash
        run: bash scripts/check-python-interop.sh

      - name: Use Node.js 22 for generated proof checks
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install JavaScript dependencies for generated proofs
        shell: bash
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check TypeScript-normalized pending proof with canonical Python client
        shell: bash
        run: |
          output="$(mktemp --suffix=.ots)"
          trap 'rm -f "$output"' EXIT
          node scripts/generate-typescript-normalized-pending.mjs \
            tests/fixtures/opentimestamps/incomplete.txt.ots \
            "$output"
          ots info "$output" >/dev/null

      - name: Check ProofStamp-generated pending proof with canonical Python client
        shell: bash
        run: |
          output="$(mktemp --suffix=.ots)"
          trap 'rm -f "$output"' EXIT
          node scripts/generate-proofstamp-pending-fixture.mjs "$output"
          ots info "$output" >/dev/null
