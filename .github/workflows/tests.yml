name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Run Node interoperability tests when present
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            echo "No package.json yet; CI bootstrap only."
            exit 0
          fi
          npm install --ignore-scripts --no-audit --no-fund
          npm test

  canonical-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Use Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Run canonical Python interoperability tests when present
        shell: bash
        run: |
          if [ ! -f scripts/check-python-interop.sh ]; then
            echo "No canonical Python interop script yet; CI bootstrap only."
            exit 0
          fi
          python -m pip install --disable-pip-version-check "git+https://github.com/opentimestamps/opentimestamps-client.git@cd71c7609421bed2a07b9642a3c02a58c9fd2cdf"
          bash scripts/check-python-interop.sh
